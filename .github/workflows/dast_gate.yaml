name: DAST Security Gate

on: push

jobs:
  scan_dast:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: segredo-exclusivo-do-ambiente-de-ci
      ADMIN_MFA_CODE: "123456"
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Iniciar a API
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for tentativa in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Executar OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000/docs
          allow_issue_writing: false
          fail_action: true
          cmd_options: -I
